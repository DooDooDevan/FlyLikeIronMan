; Iron Man flight settings.
; Suit Control (F7 in game) edits this for you; changes apply at once.
; settings.ini is made from settings.default.ini the first time the flight
; script starts. You can also edit settings.ini by hand (not the default file):
; save it and press F7 > the change applies, or restart the flight script.
; To get the original settings back: Suit Control > ABOUT > Reset all, or delete settings.ini.
; Lines starting with ; are comments. A typo never breaks anything: the script
; prints one line about it and uses the default for that setting.

[keys]
; Key names: A-Z, 0-9, F1-F12, SHIFT, CTRL, ALT, SPACE, TAB, HOME, END, PGUP,
; PGDN, INSERT, DELETE, SCROLLLOCK, PAUSE, UP, DOWN, LEFT, RIGHT, NUMPAD0-9,
; MOUSE4 / MOUSE5 (the side buttons on your mouse), MOUSE3 (wheel click), none.
; AZERTY keyboard: forward = Z, left = Q (back = S, right = D stay).
forward = W
back = S
left = A
right = D
; R (climb) and F (descend) are also game keys on foot (R reloads/recharges,
; F is the Analysis Visor on some setups). If they get in your way, the mouse
; side buttons are a good choice: climb = MOUSE5, descend = MOUSE4.
climb = R
descend = F
afterburner = SHIFT
fly_toggle = F8
faster = PGUP
slower = PGDN
quit = END
; Double-tap Space to start / stop flying (no = only fly_toggle does it).
double_tap_space = yes
; Optional safety switch: a key that disarms / arms take-off, so a stray
; double-tap of Space never lifts you off. none = no such key.
; With SCROLLLOCK the keyboard light shows it: light ON = take-off armed.
arm_toggle = none
; Weapons while flying: your multi-tool fires your STARSHIP's weapons (Boltcaster =
; Photon Cannon, Scatter Blaster = Positron Ejector, Pulse Spitter = Infraknife,
; Neutron Cannon = Cyclotron Ballista, Incinerator = Rockets, Mining Beam = Phase
; Beam; pick them with G / the hold-G wheel as usual). This key flips between the
; ship's weapons and your multi-tool as it is. Landing always puts it back.
arsenal_toggle = MOUSE3
; Opens Suit Control (this file's settings, start / restart) in the game.
panel = F7

[flight]
; The throttle (hold W / S) sets your speed between min_speed and max_speed; start_speed sets
; how hard the sonic boom kicks. (PgUp / PgDn no longer change the speed.)
start_speed = 18
; Start with the speed you used last time (yes) or always start_speed (no).
remember_speed = yes
min_speed = 5
max_speed = 80
; Afterburner: toggle = Shift switches it on/off; hold = it fires while Shift is held.
afterburner_mode = toggle
; Holding climb also fires the afterburner.
climb_fires_afterburner = yes
; Seconds between the two taps of a double-tap (Space).
double_tap_window = 0.30
; Swap A and D if strafing comes out backwards.
flip_strafe = no
; A steep dive straight into the ground lands you (the super-hero landing).
dive_lands = yes
; Seconds holding W takes to reach full throttle, and holding S to come back to a hover.
throttle_up_time = 2.5
throttle_down_time = 1.5
; Low-speed control: 1 = even all the way; higher = finer control at the slow end.
throttle_curve = 1.6
; Seconds the throttle rests at a hover before S starts flying you backwards.
hover_detent = 0.5
; Top speed flying backwards (hold S past the hover).
reverse_speed = 20
; Afterburner: thrust times this, seconds it burns on a full charge, seconds to recharge it from empty.
afterburner_power = 2.4
afterburner_time = 10
afterburner_recharge = 15
; Diving (W with the camera pointed steeply down): thrust times this.
dive_boost = 1.15
; Seconds between the two taps of S for a hard brake.
hard_brake_window = 0.30
; The throttle's first quarter: your lean follows the throttle up to 45 degrees, the hover's hands tilting back,
; and your flames grow from this size at a hover (1 = full size) to full size at a quarter throttle.
pilot_flame = 0.2
; Sideways (A / D) and up / down (R / F) moves at a hover: they push at least like this speed (5 = as slow as before).
hover_move_speed = 10

[boom]
; The sonic boom: on a planet, each press of Caps Lock fires one blast (one of the meter's three sections),
; each bigger than the last. It needs more than a quarter throttle.

; How hard a blast kicks you forward (1 = as shipped), and the thrust boost at the biggest blast's peak.
kick_scale = 1.0
boost = 6
; Seconds for the meter to refill from empty.
refill_time = 16

[cruise]
; The interplanetary cruise, in space: press Caps Lock once for stage 1 (it fills by itself with the charge-up),
; then hold Caps Lock to raise it through stages 2 and 3.

; Top cruise speed in km/s (100 to 450): higher = quicker trips between planets.
top_speed_kms = 200
; Seconds each tier after the first takes to fill while Caps is held, and holding S takes from full to none.
tier_fill_time = 2.0
drain_time = 2.0

[camera]
; Seconds the camera keeps where you aimed it before easing back behind you.
recenter_delay = 5.0
; Speed effects: the camera pulls back and the view widens when you go fast.
; Feeling queasy? Set speed_effects = no.
speed_effects = yes
motion_blur = yes
; How strong the speed effects are (1 = as shipped, 0 = none), and the short camera kicks of booms and rolls.
effects_strength = 1.0
camera_kicks = yes

[sound]
; Short beeps for status (ready, speed change, refused take-off ...).
; no = only the suit sounds play.
cues = yes
; Volume of every mod sound, 0 (silent) to 1000 (full).
sound_volume = 1000
; The suit's own sounds (take-off, landing, afterburner, rolls) and the sonic booms (also the cruise's tier booms).
suit_sounds = yes
boom_sounds = yes
; Interplanetary cruise sounds (the charge-up, the stage call-outs and the hum): yes or no.
interplanetary = yes
; Volume of the cruise's hum, 0 to 1.
hum_volume = 0.55

[hud]
; The on-screen HUD (the bands under the game's compass, the speed and the space map): yes or no.
hud = yes
; The map of nearby planets and places in space, and the rings a boom sends across the screen.
space_map = yes
shock_waves = yes

[effects]
; The warp effects of the interplanetary cruise: streaks and rings, and the blur (the heaviest: turn it off on slower PCs).
warp_effects = yes
warp_blur = yes

[panel]
; Suit Control itself: stay on top of other windows, open when the flight script starts, ask before quitting.
always_on_top = no
open_with_flight = no
confirm_quit = yes
; Start Suit Control hidden with the game, so F7 opens it at once.
warm_start = yes

[pad]
; Xbox controller (any XInput pad; plug it in any time). The left stick flies
; (analog: tilt a little to go slowly), the right stick is the game's own camera.
; Button names: A B X Y LB RB LT RT LS RS (stick clicks) BACK START
; UP DOWN LEFT RIGHT (d-pad), or none. LT / RT give analog climb / descend.
; On foot every button does only its normal thing in the game; the pad just starts
; a flight (double-tap A, the game's jump). While you fly, the game ignores its own
; actions on the buttons below (B back, X reload, LB / RB alt fire and melee, the
; stick clicks ...); the d-pad (its quick menu), Y, the triggers and the menu buttons
; stay the game's.
enabled = yes
; double-tap this to start / stop flying (like Space)
fly_toggle = A
; hold to fly up (fires the afterburner while held, like R) / down (like F)
climb = B
descend = X
; hold to roll left / right while flying forward (like A / D); at a hover they sidestep. Flying forward
; the left stick's sideways push does nothing: at a hover it sidesteps too
roll_left = LB
roll_right = RB
; afterburner (like Shift): double-flick the left stick up (built in); a button here works as well
afterburner = none
; faster / slower (like PgUp / PgDn; with the throttle they do nothing, so the
; d-pad right / left stay the game's)
faster = RIGHT
slower = LEFT
; sonic boom (like Caps Lock: each press = one blast; in space hold it for the interplanetary
; cruise): click the right stick. Hard brake: double-flick the left stick back (like double-
; tapping S), or a button here (none: d-pad down stays the game's quick menu, which you need)
sonic_boom = RS
hard_brake = none
; quit the flight script (like holding End): hold both stick clicks
quit = LS+RS
; stick dead zone, 0..0.95 (raise it if the character creeps with the stick let go)
stick_deadzone = 0.24
trigger_deadzone = 0.12
; how far the stick must tilt to count as "holding" a direction (sidestep, free roll, poses)
move_threshold = 0.5
; 1 = thrust follows the stick linearly; 2 = finer control near the centre
stick_curve = 1.0
double_tap_window = 0.35
; seconds both stick clicks must be held before quitting starts (then End's own 1 s)
quit_hold = 0.5
; short rumbles: take-off, landing, afterburner (only while you use the pad)
rumble = yes
rumble_strength = 0.6

[debug]
; Write every flight to flight_log.csv (only needed for bug reports).
flight_log = no
; Show technical details (addresses, vectors) in the console.
verbose = no

[game]
; Leave empty: the game is found automatically (Steam libraries, GOG, a running game).
; Only if it isn't found: your No Man's Sky folder (the one with Binaries and GAMEDATA), e.g.
; path = D:\SteamLibrary\steamapps\common\No Man's Sky
path =
